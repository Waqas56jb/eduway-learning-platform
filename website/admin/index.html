<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0B1F3A" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="description" content="EDUWAY Admin — operations console for the EDUWAY learning platform." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://images.unsplash.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700;800&family=Tajawal:wght@400;500;700;800&display=swap"
      rel="stylesheet"
    />
    <title>EDUWAY Admin</title>
    <script>
      (function () {
        try {
          var l = localStorage.getItem('eduway.admin.lang') || 'en';
          var t = localStorage.getItem('eduway.admin.theme') || 'light';
          var d = document.documentElement;
          d.lang = l;
          d.dir = l === 'ar' ? 'rtl' : 'ltr';
          d.setAttribute('data-theme', t);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
